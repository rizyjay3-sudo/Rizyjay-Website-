<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rizy Jay | Official Website</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #050505;
  color: #fff;
  line-height: 1.6;
}

/* NAVIGATION */
nav {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(5,5,5,0.96);
  border-bottom: 1px solid #292929;
  padding: 16px 20px;
  text-align: center;
}

.logo {
  color: #d4af37;
  font-size: 23px;
  font-weight: bold;
  letter-spacing: 3px;
}

nav a {
  color: #ddd;
  text-decoration: none;
  margin: 0 8px;
  font-size: 14px;
}

nav a:hover {
  color: #d4af37;
}

/* HERO */
.hero {
  min-height: 92vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 50px 20px;

  background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.9)),
    url("rizyjay.jpg") center/cover no-repeat;
}

.hero img {
  width: 230px;
  height: 230px;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid #d4af37;
  box-shadow: 0 0 35px rgba(212,175,55,.45);
  margin-bottom: 25px;
}

.badge {
  color: #d4af37;
  font-size: 13px;
  letter-spacing: 4px;
  margin-bottom: 12px;
}

.hero h1 {
  font-size: clamp(42px, 10vw, 70px);
  line-height: 1;
  margin-bottom: 15px;
}

.hero h1 span {
  color: #d4af37;
}

.hero p {
  color: #ccc;
  font-size: 18px;
  max-width: 600px;
  margin-bottom: 25px;
}

.button {
  display: inline-block;
  background: #d4af37;
  color: #050505;
  padding: 13px 25px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
  margin: 5px;
}

/* SECTIONS */
section {
  max-width: 900px;
  margin: auto;
  padding: 70px 20px;
}

.section-title {
  text-align: center;
  font-size: 38px;
  margin-bottom: 35px;
}

.section-title span {
  color: #d4af37;
}

/* ABOUT */
.about {
  text-align: center;
}

.about p {
  color: #ccc;
  font-size: 18px;
  max-width: 700px;
  margin: auto;
}

/* MUSIC */
.music-card {
  background: #111;
  border: 1px solid #292929;
  border-radius: 22px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.5);
}

.music-card img {
  width: 230px;
  height: 230px;
  object-fit: cover;
  border-radius: 15px;
  margin-bottom: 20px;
}

.song-title {
  font-size: 27px;
  margin-bottom: 8px;
}

.artist-name {
  color: #d4af37;
  font-weight: bold;
  margin-bottom: 15px;
}

.music-card p {
  color: #bbb;
  margin-bottom: 15px;
}

audio {
  width: 100%;
  margin: 15px 0;
}

.download {
  display: inline-block;
  background: #d4af37;
  color: #000;
  padding: 14px 25px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 10px;
}

.download:hover {
  transform: scale(1.04);
}

.social {
  text-align: center;
}
