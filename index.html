<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trinity Styler</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .artist {
      padding: 30px 20px;
    }

    .artist img {
      width: 280px;
      height: 280px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid white;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #bbb;
      font-size: 18px;
    }

    .song {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: #222;
      border-radius: 20px;
    }

    .song h2 {
      margin-bottom: 20px;
    }

    audio {
      width: 100%;
    }

    .social {
      margin-top: 25px;
    }

    .social a {
      color: white;
      text-decoration: none;
      margin: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <section class="artist">

    <img src="trinity.jpg" alt="Trinity Styler">

    <h1>Trinity Styler</h1>

    <p class="subtitle">Artist • Music • Vibes</p>

    <div class="song">
      <h2>🎵 Anjilawo omubili</h2>

      <audio controls>
        <source src="anjilawo-omubili.mp3" type="audio/mpeg">
        Your browser does not support audio.
      </audio>
    </div>

    <div class="social">
      <a href="https://www.tiktok.com/@trinitystyler" target="_blank">
        TikTok
      </a>
    </div>

  </section>

</body>
</html>
